#---------------------------------- Modifiable Properties ----------------------------------------------------------#
# Committed defaults are the local docker-compose stack.
# Rancher (or the shell) overrides any key when an environment variable with the same name is set.
# ConfigManager uses System.getenv(key) over the file value. -Denv.endpoint does not replace these keys.
# Laptop run against a remote server: edit the URL and database keys below for that run, and do not commit those edits.
# Secrets: leave blank; supply via env vars / .env.local.

#------------------------ Environment URLs and Database Connections ------------------------#

# Local IAM is WireMock on :8082.
keycloak-external-url = http://localhost:8082

# Local Postgres (compose maps 5455 → 5432).
audit_url = jdbc:postgresql://localhost:5455/mosip_idrepo
partner_url = jdbc:postgresql://localhost:5455/mosip_idrepo

# Database server for connections.
db-server = localhost
db-port = 5455


#------------------------ secrets and passwords  ------------------------#

#------------------------ Keycloak Passwords ------------------------#
# Used for Keycloak authentication.
keycloak_Password =

#------------------------ PostgreSQL Database Passwords ------------------------#
# Credentials for connecting to Postgres databases.
audit_password =
partner_password =
postgres-password =

