GetDraftV2:
  IdRepository_GetDraftV2_VerifyUinAllocated_NewPacket_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: getDraftV2 chain proving createDraftV2's default (generateUin true, no uin) NEW-packet draft actually has a UIN allocated. DEPENDS ON SUITE ORDER - reuses $RIDV2NEW$, drafted by IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos in CreateDraftV2.yml
      uniqueIdentifier: TC_IDRepo_GetDraftV2_01
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
    "UIN": "$REGEXP:^[0-9]+$"
}'

  IdRepository_GetDraftV2_VerifyUinNotAllocated_LostPacket_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: getDraftV2 chain proving createDraftV2's generateUin false LOST-packet draft has NOT had a UIN allocated yet - the one direction $REGEXP can't express, so this test case name's "UinNotAllocated" convention routes GetWithParam to the assertDraftUinNotAllocated() utility instead of the declarative diff. DEPENDS ON SUITE ORDER - reuses $RIDV2LOST$, drafted by IdRepository_CreateDraftV2_LostPacketGenerateUinFalse_Smoke_Pos in CreateDraftV2.yml
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_14
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
}'

  IdRepository_GetDraftV2_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get a draft by registrationId with no query params (type defaults to "all" per the swagger description). DEPENDS ON SUITE ORDER - reuses $RIDV2NEW$, drafted by IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos in CreateDraftV2.yml. GET is non-mutating so this RID is safely reused read-only across every test case in this file
      uniqueIdentifier: TC_IDRepo_GetDraftV2_02
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeDemographics_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Get a draft passing type=demographics - the granular-retrieval query param that's the one genuinely V2-specific addition on this endpoint (getDraft v1 has no "type" param at all). Assumption - inferred from the param name/swagger description only, not confirmed against the v2 controller/service source (not present in this local checkout)
      uniqueIdentifier: TC_IDRepo_GetDraftV2_03
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "demographics"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeBiometrics_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Get a draft passing type=biometrics. Same assumption as TypeDemographics - inferred from swagger, not confirmed against v2 source
      uniqueIdentifier: TC_IDRepo_GetDraftV2_04
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "biometrics"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeAllExplicit_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Get a draft passing type=all explicitly - same result as omitting it (TC_IDRepo_GetDraftV2_02), just exercising the explicit value rather than relying on the documented default
      uniqueIdentifier: TC_IDRepo_GetDraftV2_05
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "all"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_WithFingerExtractionFormat_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?fingerExtractionFormat={fingerExtractionFormat}
      description: Get a draft passing fingerExtractionFormat - representative of the three parallel extraction-format params (finger/iris/face), which all follow the same identical pattern, so only one is exercised rather than three near-duplicate test cases
      uniqueIdentifier: TC_IDRepo_GetDraftV2_06
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithFingerFormat
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "fingerExtractionFormat": "ISO"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_InvalidTypeValue_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Get a draft using an invalid type value - should be rejected with error IDR-IDC-002
      uniqueIdentifier: TC_IDRepo_GetDraftV2_07
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "bogus"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-002",
      "message": "Invalid Input Parameter - type"
    }
  ]
}'

  IdRepository_GetDraftV2_NoDraftExists_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get a registrationId that has no draft at all - must be rejected as no record found. No ordering dependency by design - $RIDV2FRESH$ is a fresh, never-drafted RID
      uniqueIdentifier: TC_IDRepo_GetDraftV2_08
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_GetDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get a draft using a blank registration ID - should be rejected with error IDR-IDC-003
      uniqueIdentifier: TC_IDRepo_GetDraftV2_09
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":""
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_GetDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get a draft using an invalid/unauthenticated auth token. Reuses $RIDV2NEW$ but the RID is incidental here - auth is expected to be rejected before the draft is looked up
      uniqueIdentifier: TC_IDRepo_GetDraftV2_10
      role: invalid
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "500"
}'

  IdRepository_GetDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get a draft using a valid token that does not carry the role required for this API. Reuses $RIDV2NEW$ but the RID is incidental here - authorization is expected to be rejected before the draft is looked up
      uniqueIdentifier: TC_IDRepo_GetDraftV2_11
      role: resident
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "403"
}'
