GetDraftV2:
  IdRepository_GetDraftV2_VerifyUinAllocated_NewPacket_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that the draft created for a NEW packet has a UIN assigned
      uniqueIdentifier: TC_IDRepo_GetDraftV2_01
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
    "UIN": "$REGEXP:^[0-9]+$"
}'

  IdRepository_GetDraftV2_VerifyUinNotAllocated_LostPacket_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that the draft created for a LOST packet does not have a UIN assigned yet
      uniqueIdentifier: TC_IDRepo_GetDraftV2_12
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
}'

  IdRepository_GetDraftV2_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that a draft is returned when no query parameters are passed (type defaults to all)
      uniqueIdentifier: TC_IDRepo_GetDraftV2_02
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeDemographics_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Verify that a draft is returned with only demographic data when type is demographics
      uniqueIdentifier: TC_IDRepo_GetDraftV2_03
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "demographics"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeBiometrics_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Verify that a draft is returned with only biometric data when type is biometrics
      uniqueIdentifier: TC_IDRepo_GetDraftV2_04
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "biometrics"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_TypeAllExplicit_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Verify that a draft is returned with all data when type is all
      uniqueIdentifier: TC_IDRepo_GetDraftV2_05
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "all"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_WithFingerExtractionFormat_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?fingerExtractionFormat={fingerExtractionFormat}
      description: Verify that a draft is returned when a finger extraction format is passed
      uniqueIdentifier: TC_IDRepo_GetDraftV2_06
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithFingerFormat
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$",
      "fingerExtractionFormat": "ISO"
      }'
      output: '{
      "status": "DRAFT"
}'

  IdRepository_GetDraftV2_InvalidTypeValue_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}?type={type}
      description: Verify that getting a draft is rejected when the type parameter has an invalid value
      uniqueIdentifier: TC_IDRepo_GetDraftV2_07
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraftV2/getDraftV2WithType
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "type": "bogus"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-002",
      "message": "Invalid Input Parameter - type"
    }
  ]
}'

  IdRepository_GetDraftV2_NoDraftExists_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that getting a draft is rejected when the RID has no draft
      uniqueIdentifier: TC_IDRepo_GetDraftV2_08
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_GetDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that getting a draft is rejected when the registration ID is blank
      uniqueIdentifier: TC_IDRepo_GetDraftV2_09
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":""
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_GetDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that getting a draft is rejected when the request uses an invalid auth token
      uniqueIdentifier: TC_IDRepo_GetDraftV2_10
      role: invalid
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "401"
}'

  IdRepository_GetDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that getting a draft is rejected when the token does not have the required role
      uniqueIdentifier: TC_IDRepo_GetDraftV2_11
      role: resident
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_GetDraftV2_UinEqualsLive_UpdatePacket_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: UPDATE draft flow - verify that a newly created UPDATE draft carries the UIN copied from the live identity
      uniqueIdentifier: TC_IDRepo_GetDraftV2_13
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2UPDATEA$"
      }'
      output: '{
    "UIN": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
}'
