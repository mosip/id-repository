ExtractBiometricsV2:
  IdRepository_ExtractBiometricsV2_NoFormats_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}
      description: Verify that extract biometrics succeeds when no extraction format is passed
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_01
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_NoFormats_NonExistentRid_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}
      description: Verify that extract biometrics succeeds with no extraction format even when the RID has no draft
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_02
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_ForFinger_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?fingerExtractionFormat=mock-1.1
      description: Extract biometrics with only fingerExtractionFormat.
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_03
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_ForIris_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?irisExtractionFormat=mock-1.1
      description: Extract biometrics with only irisExtractionFormat.
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_04
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_ForFace_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?faceExtractionFormat=mock-1.1
      description: Extract biometrics with only faceExtractionFormat.
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_05
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_ForFaceIrisFinger_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?faceExtractionFormat=mock-1.1&fingerExtractionFormat=mock-1.1&irisExtractionFormat=mock-1.1
      description: Extract biometrics with all three formats together, correctly "&"-joined.
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_06
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_ExtractBiometricsV2_WithFormat_NonExistentRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?fingerExtractionFormat=mock-1.1
      description: Verify that extract biometrics with an extraction format is rejected when the RID has no draft
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_07
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_ExtractBiometricsV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}
      description: Verify that extract biometrics is rejected when the request uses an invalid auth token
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_08
      role: invalid
      restMethod: put
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
   "responseCode": "500"
}'

  IdRepository_ExtractBiometricsV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}
      description: Verify that extract biometrics is rejected when the token does not have the required role
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_09
      role: resident
      restMethod: put
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2EXT$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_ExtractBiometricsV2_ForFaceIrisFinger_LiveCopiedDraft_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/extractbiometrics/{registrationId}?faceExtractionFormat=mock-1.1&fingerExtractionFormat=mock-1.1&irisExtractionFormat=mock-1.1
      description: Verify that all biometric types can be extracted from a re-created draft whose biometrics were copied from the live identity
      uniqueIdentifier: TC_IDRepo_ExtractBiometricsV2_10
      role: idrepo
      restMethod: put
      inputTemplate: idRepository/ExtractBiometrics/extractBiometrics
      outputTemplate: idRepository/ExtractBiometrics/extractBiometricsResult
      input: '{
      "registrationId":"$RIDV2LATEST$"
      }'
      output: '{
      "status": "DRAFTED"
}'
