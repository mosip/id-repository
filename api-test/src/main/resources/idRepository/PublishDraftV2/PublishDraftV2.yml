PublishDraftV2:
  IdRepository_DraftV2Lifecycle_GetDraftUinEqualsStamped_LostPacket_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Verify that the LOST draft returns the UIN that was stamped on it by the update UIN data API
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_15
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
    "UIN": "$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$"
}'

  IdRepository_DraftV2Lifecycle_LiveUnchangedWhileUpdateDraftOpen_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: UPDATE draft flow - verify that the live identity still has the old postal code while the updated draft is not yet published
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_16
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14022"
}'

  IdRepository_PublishDraftV2_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish a fully drafted identity - expected status ACTIVATED
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_01
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2UPDATEA$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_RePublishDraftV2_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing the same draft a second time is rejected because the first publish removed it
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_02
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2UPDATEA$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_NoDraftExists_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing is rejected when the RID never had a draft
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_03
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_InvalidRidFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing is rejected as not found when the RID contains special characters
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_04
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RUNCONTEXT$ajajaj@gddb#$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish using a blank registration ID - should be rejected with error IDR-IDC-003
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_05
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":""
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_PublishDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing a draft is rejected when the request uses an invalid auth token
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_06
      role: invalid
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "500"
}'

  IdRepository_PublishDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing a draft is rejected when the token does not have the required role
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_07
      role: resident
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_PublishDraftV2_NewPacketDraft_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that the updated NEW packet draft is published and the identity becomes ACTIVATED
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_08
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_LostPacketNotStamped_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that publishing a LOST draft is rejected when no UIN was ever stamped on it
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_09
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2LOSTNOUIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-015"
    }
  ]
}'

  IdRepository_PublishDraftV2_LostPacketStamped_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that the LOST draft is published after its UIN was stamped and the identity becomes ACTIVATED
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_10
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_OlderRidChainFirstRid_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Older-RID flow, step 3 - verify that the draft on the older RID is published
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_11
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2OLD$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_LostPacketStampedBeforeUpdate_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Verify that a LOST draft stamped before any update is published using identity data filled from the live UIN
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_12
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2LOSTSTAMPFIRST$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_DraftV2Lifecycle_LiveUpdatedAfterPublish_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: UPDATE draft flow - verify that the live identity has the new postal code from the draft after the draft is published
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_17
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14555"
}'

  IdRepository_DraftV2Lifecycle_LiveBiometricsReadableAfterPublish_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: UPDATE draft flow - verify that the live biometrics can be retrieved after the draft is published
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_18
      role: idrepo
      restMethod: get
      checkErrorsOnlyInResponse: true
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/error
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "bio"
      }'
      output: '{
}'

  IdRepository_DraftV2Lifecycle_LostUpdateAfterStampPublished_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: LOST draft flow - verify that after publish the live identity has the postal code from the draft update, not the old value
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_40
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
