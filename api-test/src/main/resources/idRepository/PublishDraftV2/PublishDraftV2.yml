PublishDraftV2:
  IdRepository_DraftV2Lifecycle_GetDraftUinEqualsStamped_LostPacket_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: Get the $RIDV2LOST$ LOST draft after UpdateDraftUinData stamped it - response.identity.UIN must equal the stamped LostScen UIN.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_15
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
    "UIN": "$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$"
}'

  IdRepository_DraftV2Lifecycle_LiveUnchangedWhileUpdateDraftOpen_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: U2 - the $RIDV2UPDATEA$ UPDATE draft was updated to postalCode 14555 but not yet published - the live NewScen identity must still show 14022.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_16
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14022"
}'

  IdRepository_PublishDraftV2_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish a fully drafted identity - expected status ACTIVATED
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_01
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2UPDATEA$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_RePublishDraftV2_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish the same registrationId a second time - the draft was deleted by the first publish, so this must be rejected as no record found.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_02
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2UPDATEA$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_NoDraftExists_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish a registrationId that never had a draft at all - must be rejected as no record found.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_03
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_InvalidRidFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish a registrationId containing special/URL-sensitive characters - expected to be rejected the same as any not-found RID (IDR-IDC-007).
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_04
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RUNCONTEXT$ajajaj@gddb#$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_PublishDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish using a blank registration ID - should be rejected with error IDR-IDC-003
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_05
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":""
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_PublishDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish using an invalid/unauthenticated auth token - must be rejected before the draft is looked up.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_06
      role: invalid
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "500"
}'

  IdRepository_PublishDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish using a valid token that lacks the required role - must be rejected before the draft is looked up.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_07
      role: resident
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_PublishDraftV2_NewPacketDraft_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish the NEW-packet draft created and updated earlier on $RIDV2NEW$ - expected status ACTIVATED; the RID is re-drafted afterwards in DraftV2Lifecycle.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_08
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2NEW$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_LostPacketNotStamped_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish the $RIDV2LOSTNOUIN$ LOST draft that was updated but never UIN-stamped via uindata - must be rejected as UIN details not found in draft.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_09
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2LOSTNOUIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-015"
    }
  ]
}'

  IdRepository_PublishDraftV2_LostPacketStamped_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish the $RIDV2LOST$ LOST draft after UpdateDraftUinData stamped its matched UIN - completes the LOST flow, expected status ACTIVATED.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_10
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2LOST$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_OlderRidChainFirstRid_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Older-RID chain step 3 - publish the $RIDV2OLD$ draft; the live UIN row now carries $RIDV2OLD$ until $RIDV2LATEST$ is published.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_11
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2OLD$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_PublishDraftV2_LostPacketStampedBeforeUpdate_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/publish/{registrationId}
      description: Publish the $RIDV2LOSTSTAMPFIRST$ LOST draft whose identity came only from the uindata backfill - expects the intended ACTIVATED. Depends on the stamp-first NPE fix - until then UpdateDraftUinData_12 rolls back, the draft has no UIN and this returns IDR-IDC-015.
      uniqueIdentifier: TC_IDRepo_PublishDraftV2_12
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RIDV2LOSTSTAMPFIRST$"
      }'
      output: '{
      "status": "ACTIVATED"
}'

  IdRepository_DraftV2Lifecycle_LiveUpdatedAfterPublish_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: U3 - after PublishDraftV2 published the $RIDV2UPDATEA$ UPDATE draft, the live NewScen identity must show the drafted postalCode 14555.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_17
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14555"
}'

  IdRepository_DraftV2Lifecycle_LiveBiometricsReadableAfterPublish_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: U3 - after publish moved biometrics from _draft/{ridHash}/ to the live {uinHash}/ path, retrieving the NewScen identity with type=bio must succeed without errors.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_18
      role: idrepo
      restMethod: get
      checkErrorsOnlyInResponse: true
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/error
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "bio"
      }'
      output: '{
}'

  IdRepository_DraftV2Lifecycle_LostUpdateAfterStampPublished_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: L3 - after PublishDraftV2_10 published the $RIDV2LOST$ draft, the live LostScen identity must show postalCode 14999 from the post-stamp update, not the backfilled live 14022.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_40
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14999"
}'
