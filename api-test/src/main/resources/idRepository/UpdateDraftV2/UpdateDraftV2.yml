  "value": "$BIOVALUE$",
  "category": "individualBiometrics",
  "version": "v1",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-015"
    }
  ]
}'

