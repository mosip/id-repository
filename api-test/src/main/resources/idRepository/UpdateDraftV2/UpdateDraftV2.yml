      restMethod: patch
      checkOnlyStatusCodeInResponse: true
      outputTemplate: idRepository/responseCode
      input: '{
  "id": "mosip.id.create",
  "registrationId": "$RIDV2NEW$",
  "dateOfBirth": "1992/04/15",
  "email": "$EMAILVALUE$",
  "phone": "$PHONENUMBERFORIDENTITY$",
  "value": "$BIOVALUE$",
  "category": "individualBiometrics",
  "version": "v1",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "responseCode": "403"
}'

  IdRepository_UpdateDraftV2_OlderRidChainFirstRid_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/update/{registrationId}
      description: Older-RID chain step 2 - update the $RIDV2OLD$ UPDATE draft before it is published.
      uniqueIdentifier: TC_IDRepo_UpdateDraftV2_11
      role: idrepo
      restMethod: patch
      outputTemplate: idRepository/UpdateDraft/updateDraftResult
