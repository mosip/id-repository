      description: N1a - update the $RIDV2LOST$ LOST draft (already updated by TC_04, not yet stamped) with no identity in the request - the merge returns early, so it must not fail even though uinHash is null.
      uniqueIdentifier: TC_IDRepo_UpdateDraftV2_15
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/DraftV2Lifecycle/updateDraftV2NoIdentity
      outputTemplate: idRepository/UpdateDraft/updateDraftResult
