  IdRepository_UpdateDraftV2_LostPacketRepeatedUpdateBeforeStamp_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/update/{registrationId}
      description: Second, identity-changing update on the $RIDV2LOSTNOUIN$ LOST draft (TC_10 did the first) while its uinHash is still null - the service deliberately rejects it as UIN details not found in draft (updateDemographicData guard) instead of NPE-ing in updateJsonObject.
      uniqueIdentifier: TC_IDRepo_UpdateDraftV2_12
