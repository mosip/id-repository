DraftV2PostDiscardChecks:
  IdRepository_DraftV2Lifecycle_LiveDemographicsIntactAfterDiscard_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: U4 - after the $RIDV2DISCARDUPDATE$ UPDATE draft was discarded, the live NewScen identity must still show the published postalCode 14555.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_21
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityPostalCodeResult
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "demo"
      }'
      output: '{
      "postalCode": "14555"
}'

  IdRepository_DraftV2Lifecycle_LiveBiometricsIntactAfterDiscard_Smoke_Pos:
      endPoint: /idrepository/v1/identity/idvid/{id}?type={type}
      description: U4 - after the UPDATE draft discard, retrieving the NewScen identity with type=bio must still succeed - discard must not delete live {uinHash}/ biometrics.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_22
      role: idrepo
      restMethod: get
      checkErrorsOnlyInResponse: true
      inputTemplate: idRepository/DraftV2Lifecycle/retrieveIdentityWithType
      outputTemplate: idRepository/error
      input: '{
      "id":"$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "type": "bio"
      }'
      output: '{
}'

  IdRepository_DraftV2Lifecycle_RecreatedNewDraftFieldAbsent_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: K1 step 5 - get the re-created $RIDV2NEWREPROCESS$ draft - the postalCode 14777 from the discarded draft must not be carried over (no stale partial identity).
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_29
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2NEWREPROCESS$"
      }'
      output: '{
      "absentField": "postalCode"
}'

  IdRepository_DraftV2Lifecycle_RecreatedLostDraftUinNotAllocated_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/{registrationId}
      description: K5 step 6 - get the re-created $RIDV2LOSTRESTAMP$ LOST draft - the UIN stamped before discard must not be carried over.
      uniqueIdentifier: TC_IDRepo_DraftV2Lifecycle_30
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/GetDraft/getDraft
      outputTemplate: idRepository/GetDraftV2/getDraftV2UinResult
      input: '{
      "registrationId":"$RIDV2LOSTRESTAMP$"
      }'
      output: '{
}'
