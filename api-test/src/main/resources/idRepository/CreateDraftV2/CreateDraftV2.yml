    }
  ]
}'

  IdRepository_CreateDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using an invalid/unauthenticated auth token - must be rejected before the RID is looked up.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_11
