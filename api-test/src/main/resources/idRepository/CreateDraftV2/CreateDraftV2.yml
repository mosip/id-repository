CreateDraftV2:
  # $RIDV2NEW$ is reused by IdRepository_CreateDraftV2_DuplicateRid_Neg (this file), UpdateDraftV2.yml, and GetDraftV2.yml - those depend on this running first.
  IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a NEW packet with no request body fields - UIN and generateUin both default, so a fresh UIN is auto-generated.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_01
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_NewPacketExplicitGenerateUinTrue_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a NEW packet with generateUin explicitly set to true and no uin - equivalent to the default, UIN is auto-generated
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_02
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2NEWEXPLICIT$",
      "uin": "$REMOVE$",
      "generateUin": "true"
      }'
      output: '{
    "status": "DRAFTED"
}'

  # Depends on AddIdentity.yml's IdRepository_AddIdentity_For_NewScen_smoke_Pos having run (uses its UIN). $RIDV2UPDATEA$ is reused by UpdateDraftV2.yml.
  IdRepository_CreateDraftV2_UpdatePacketWithUin_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for an UPDATE packet using an existing valid UIN, generateUin omitted so it defaults to true.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_03
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2UPDATEA$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_UpdatePacketWithUinAndGenerateUinTrue_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for an UPDATE packet by passing an existing valid UIN with generateUin explicitly set to true
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_04
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "generateUin": "true"
      }'
      output: '{
    "status": "DRAFTED"
}'

  # $RIDV2LOST$ is reused by UpdateDraftV2.yml and GetDraftV2.yml - those depend on this running first.
  IdRepository_CreateDraftV2_LostPacketGenerateUinFalse_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a LOST packet with generateUin false and no uin - UIN allocation is deferred until updateDraftUinData runs after ABIS.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_05
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2LOST$",
      "uin": "$REMOVE$",
      "generateUin": "false"
      }'
      output: '{
    "status": "DRAFTED"
}'

  # Must run after IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos in this file.
  IdRepository_CreateDraftV2_DuplicateRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Re-create a draft for a registrationId that already has a draft - must be rejected as a duplicate record.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_06
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-012"
    }
  ]
}'

  IdRepository_CreateDraftV2_InvalidRidFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a registrationId that does not match the configured RID pattern
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_07
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RUNCONTEXT$ajajaj@gddb#$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_CreateDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a blank registrationId
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_08
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_CreateDraftV2_UinNotFound_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a well-formed uin that does not exist in the ID repository
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_09
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "9999999999999",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_CreateDraftV2_InvalidUinFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using an invalid uin format - should be rejected with error IDR-IDC-007
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_10
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "abc123",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  # Reuses $RIDV2NEW$ incidentally; does not depend on IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos having run.
  IdRepository_CreateDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using an invalid/unauthenticated auth token - must be rejected before the RID is looked up.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_11
      role: invalid
      restMethod: post
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "responseCode": "500"
}'

  # Reuses $RIDV2NEW$ incidentally; does not depend on IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos having run.
  IdRepository_CreateDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using a valid token that lacks the registration-processor role - must be rejected before the RID is looked up.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_12
      role: resident
      restMethod: post
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "responseCode": "403"
}'

  # Mirrors V1's dedicated $RIDEXT$ pattern in CreateDraft.yml. $RIDV2EXT$ is reused by ExtractBiometricsV2.yml, which depends on this running first.
  IdRepository_CreateDraftV2_ForExtraction_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft dedicated to ExtractBiometricsV2.yml, kept isolated from the main $RIDV2NEW$ lifecycle chain.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_13
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2EXT$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'
