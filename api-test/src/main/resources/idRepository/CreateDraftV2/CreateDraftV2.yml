CreateDraftV2:
  IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a NEW packet with no request body fields - uin omitted so a fresh UIN is auto-generated, generateUin omitted so it defaults to true. $RIDV2NEW$ is reused later by IdRepository_CreateDraftV2_DuplicateRid_Neg (this file), by UpdateDraftV2.yml, and by GetDraftV2.yml - those depend on this test case running first
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_01
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_NewPacketExplicitGenerateUinTrue_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a NEW packet with generateUin explicitly set to true and no uin - equivalent to the default, UIN is auto-generated
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_02
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2NEWEXPLICIT$",
      "uin": "$REMOVE$",
      "generateUin": "true"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_UpdatePacketWithUin_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for an UPDATE packet by passing an existing valid UIN, generateUin omitted so it defaults to true. Depends on suite order - $ID:AddIdentity_For_NewScen_smoke_Pos_UIN$ requires AddIdentity.yml's IdRepository_AddIdentity_For_NewScen_smoke_Pos to have run earlier. $RIDV2UPDATEA$ is reused later by UpdateDraftV2.yml
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_03
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2UPDATEA$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_UpdatePacketWithUinAndGenerateUinTrue_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for an UPDATE packet by passing an existing valid UIN with generateUin explicitly set to true
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_04
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$",
      "generateUin": "true"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_LostPacketGenerateUinFalse_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft for a LOST packet with generateUin false and no uin - UIN allocation is skipped and resolved later via updateDraftUinData after ABIS. $RIDV2LOST$ is reused later by UpdateDraftV2.yml and by GetDraftV2.yml - those depend on this test case running first
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_05
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2LOST$",
      "uin": "$REMOVE$",
      "generateUin": "false"
      }'
      output: '{
    "status": "DRAFTED"
}'

  IdRepository_CreateDraftV2_DuplicateRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Re-create a draft for a registrationId that already has a draft - must be rejected as a duplicate record. Depends on IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos having run first in this file
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_06
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-012"
    }
  ]
}'

  IdRepository_CreateDraftV2_InvalidRidFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a registrationId that does not match the configured RID pattern
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_07
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RUNCONTEXT$ajajaj@gddb#$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_CreateDraftV2_BlankRid_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a blank registrationId
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_08
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_CreateDraftV2_UinNotFound_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a well-formed uin that does not exist in the ID repository
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_09
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "9999999999999",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_CreateDraftV2_InvalidUinFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft passing a uin that does not conform to the UIN format
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_10
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "abc123",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_CreateDraftV2_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using an invalid/unauthenticated auth token. Reuses $RIDV2NEW$ but the RID is incidental here - auth is expected to be rejected before the RID is looked up, so this does not depend on IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos having run
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_11
      role: invalid
      restMethod: post
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "responseCode": "401"
}'

  IdRepository_CreateDraftV2_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using a valid token that does not carry the registration-processor role required for this API. Reuses $RIDV2NEW$ but the RID is incidental here - authorization is expected to be rejected before the RID is looked up, so this does not depend on IdRepository_CreateDraftV2_NewPacketDefault_Smoke_Pos having run
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_12
      role: resident
      restMethod: post
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_CreateDraftV2_ForExtraction_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft dedicated to ExtractBiometricsV2.yml - kept isolated from the main $RIDV2NEW$ lifecycle chain since extraction gets called repeatedly across several sub-tests there, mirroring V1's own dedicated $RIDEXT$ pattern in CreateDraft.yml. $RIDV2EXT$ is reused later by ExtractBiometricsV2.yml, which depends on this test case running first
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_13
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftV2/createDraftV2
      outputTemplate: idRepository/CreateDraftV2/createDraftV2Result
      input: '{
      "registrationId":"$RIDV2EXT$",
      "uin": "$REMOVE$",
      "generateUin": "$REMOVE$"
      }'
      output: '{
    "status": "DRAFTED"
}'
