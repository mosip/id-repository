      endPoint: /idrepository/v1/identity/draft/v2/create/{registrationId}
      description: Create a draft using a valid token that lacks the registration-processor role - must be rejected before the RID is looked up.
      uniqueIdentifier: TC_IDRepo_CreateDraftV2_12
