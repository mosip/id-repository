IdVidMetadataSearch:
  IdRepository_IdVidMetadataSearch_With_UIN_all_Valid_Smoke:
    endPoint: /idrepository/v1/identity/idvid-metadata/search
    uniqueIdentifier: TC_IdVidMetadataSearch_01      
    description: Validate that IdVid metadata is successfully retrieved when a valid Individual ID (UIN) is provided      
    role: idrepo
    checkErrorsOnlyInResponse: true
    restMethod: post
    inputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearch
    outputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearchResult
    input: '{
      "id": "mosip.idrepo.idvid.metadata",
      "version": "1.0",
      "requesttime": "$TIMESTAMP$",
      "individualId": "$ID:AddIdentity_withValidParameters_smoke_Pos_UIN$",
	  "idType": "UIN"
}'
    output: '{
}'
  IdRepository_IdVidMetadataSearch_With_VID_all_Valid_Smoke:
    endPoint: /idrepository/v1/identity/idvid-metadata/search
    uniqueIdentifier: TC_IdVidMetadataSearch_02     
    description: Validate that IdVid metadata is successfully retrieved when a valid Individual ID (VID) is provided      
    role: idrepo
    checkErrorsOnlyInResponse: true
    restMethod: post
    inputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearch
    outputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearchResult
    input: '{
      "id": "mosip.idrepo.idvid.metadata",
      "version": "1.0",
      "requesttime": "$TIMESTAMP$",
      "individualId": "$ID:CreateVID_withValidParameters_For_VidType_Smoke_Temporary_sid_VID$",
	  "idType": "VID"
}'
    output: '{
}'
  IdRepository_IdVidMetadataSearch_With_Required_Details:
    endPoint: /idrepository/v1/identity/idvid-metadata/search
    uniqueIdentifier: TC_IdVidMetadataSearch_03  
    description: Validate that IdVid metadata is successfully retrieved when a valid Individual ID is provided without idType parameter      
    role: idrepo
    checkErrorsOnlyInResponse: true
    restMethod: post
    inputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearch
    outputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearchResult
    input: '{
      "id": "mosip.idrepo.idvid.metadata",
      "version": "1.0",
      "requesttime": "$TIMESTAMP$",
      "individualId": "$ID:AddIdentity_withValidParameters_smoke_Pos_UIN$",
	  "idType": "$REMOVE$"
}'
    output: '{
}'
  IdRepository_IdVidMetadataSearch_With_RID_As_IndividualId:
    endPoint: /idrepository/v1/identity/idvid-metadata/search
    uniqueIdentifier: TC_IdVidMetadataSearch_04
    description: Validate that IdVid metadata is successfully retrieved when valid IndividualId (RID) and idType are provided in the request      
    role: idrepo
    checkErrorsOnlyInResponse: true
    restMethod: post
    inputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearch
    outputTemplate: idRepository/IdVidMetadataSearch/IdVidMetadataSearchResult
    input: '{
      "id": "mosip.idrepo.idvid.metadata",
      "version": "1.0",
      "requesttime": "$TIMESTAMP$",
      "individualId": "$ID:AddIdentity_withValidParameters_smoke_Pos_RID$",
	  "idType": "ID"
}'
    output: '{
}'