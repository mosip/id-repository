UpdateDraftUinData:
  IdRepository_UpdateDraftUinData_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Update a lost packet draft with its resolved uin - expected status DRAFTED
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_01
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2LOST$",
      "uin": "$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_UpdateDraftUinData_NoDraftExists_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp a UIN on a registrationId that has no draft at all - must be rejected as no record found (IDR-IDC-007).
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_02
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2FRESH$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_UinNotFound_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Update a draft with a uin that fails UIN validation (9999999999999) - the controller validates the UIN before any lookup, so it is rejected as invalid input (IDR-IDC-002)
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_03
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "9999999999999"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_InvalidUinFormat_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Update a draft with an invalid uin format - rejected by controller UIN validation as invalid input (IDR-IDC-002)
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_04
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "abc123"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_BlankUin_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Update a draft with a blank uin - rejected by controller UIN validation as invalid input (IDR-IDC-002)
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_05
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": ""
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_BlankRid_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Update a draft using a blank registration ID - should be rejected with error IDR-IDC-003
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_06
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-003"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_WithInvalidToken_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp a UIN using an invalid/unauthenticated auth token - must be rejected before the draft is looked up.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_07
      role: invalid
      restMethod: patch
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
      }'
      output: '{
   "responseCode": "500"
}'

  IdRepository_UpdateDraftUinData_WithUnauthorizedRole_StatusCode_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp a UIN using a valid token that lacks the required role - must be rejected before the draft is looked up.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_08
      role: resident
      restMethod: patch
      checkOnlyStatusCodeInResponse: true
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/responseCode
      input: '{
      "registrationId":"$RIDV2NEW$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
      }'
      output: '{
   "responseCode": "403"
}'

  IdRepository_UpdateDraftUinData_RestampSameUin_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Re-stamp the already-stamped LOST draft ($RIDV2LOST$, stamped in TC_01) with the same UIN - idempotent, expected status DRAFTED.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_09
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2LOST$",
      "uin": "$ID:AddIdentity_For_DraftV2LostScen_smoke_Pos_UIN$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_UpdateDraftUinData_RestampDifferentUin_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Re-stamp the already-stamped LOST draft ($RIDV2LOST$) with a different existing UIN - must be rejected as a UIN hash mismatch.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_10
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2LOST$",
      "uin": "$ID:AddIdentity_withValidParameters_smoke_Pos_UIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-018"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_UinHeldByAnotherOpenDraft_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp the unstamped $RIDV2LOSTNOUIN$ LOST draft with the NewScen UIN, which the still-open $RIDV2UPDATEA$ draft holds - uin_draft.uin_hash is unique, so it must be rejected as a duplicate record.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_11
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2LOSTNOUIN$",
      "uin": "$ID:AddIdentity_For_NewScen_smoke_Pos_UIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-012"
    }
  ]
}'

  IdRepository_UpdateDraftUinData_StampBeforeAnyUpdate_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp the $RIDV2LOSTSTAMPFIRST$ LOST draft before any updateDraftV2 (uinData still null) - identity should be backfilled from the matched live UIN. Service currently NPEs in backfillDraftIdentityFromLiveUin (IDR-IDC-004); this test expects the intended DRAFTED.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_12
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2LOSTSTAMPFIRST$",
      "uin": "$ID:AddIdentity_For_DraftV2LostStampFirstScen_smoke_Pos_UIN$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_UpdateDraftUinData_RestampChainFirstStamp_Smoke_Pos:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: K5 step 3 - first UIN stamp on the $RIDV2LOSTRESTAMP$ LOST draft; the draft is discarded afterwards, which must release this UIN.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_13
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RIDV2LOSTRESTAMP$",
      "uin": "$ID:AddIdentity_For_DraftV2LostRestampScen_smoke_Pos_UIN$"
      }'
      output: '{
      "status": "DRAFTED"
}'

  IdRepository_UpdateDraftUinData_WellFormedUinNotInIdRepo_Neg:
      endPoint: /idrepository/v1/identity/draft/uindata/{registrationId}
      description: Stamp the unstamped $RIDV2LOSTNOUIN$ LOST draft with a valid-format UIN fresh from the UIN generator that no identity uses - passes controller UIN validation, then rejected as UIN not found.
      uniqueIdentifier: TC_IDRepo_UpdateDraftUinData_14
      role: idrepo
      restMethod: patch
      inputTemplate: idRepository/UpdateDraftUinData/updateDraftUinData
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RIDV2LOSTNOUIN$",
      "uin": "$UNUSEDUIN$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-017"
    }
  ]
}'
