CreateDraftVID:
  IdRepository_CreateDraftVID_Smoke_Pos:
      endPoint: /idrepository/v1/draft/vid
      description: Verify that the system successfully creates a draft VID when the API is called with valid input details
      uniqueIdentifier: TC_IDRepo_CreateDraftVID_01
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftVID/createDraftVID
      outputTemplate: idRepository/CreateDraftVID/createDraftVIDResult
      input: '{
      "vidType": "Perpetual",
      "UIN": "$ID:GetDraft_all_valid_smoke_sid_UIN$"
      }'
      output: '{
    "vidStatus": "DRAFT"
}'
  IdRepository_CreateDraftVID_invalid_vidtype:
      endPoint: /idrepository/v1/draft/vid
      description: Verify that the system rejects create draft VID when the API is called with an invalid VID type
      uniqueIdentifier: TC_IDRepo_CreateDraftVID_02
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftVID/createDraftVID
      outputTemplate: idRepository/error
      input: '{
      "vidType": "ddhh@312",
      "UIN": "$ID:GetDraft_all_valid_smoke_sid_UIN$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'
  IdRepository_CreateDraftVID_blank_vidtype:
      endPoint: /idrepository/v1/draft/vid
      description: Verify that the system rejects create draft VID when the API is called with a blank VID type
      uniqueIdentifier: TC_IDRepo_CreateDraftVID_03
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftVID/createDraftVID
      outputTemplate: idRepository/error
      input: '{
      "vidType": "",
      "UIN": "$ID:GetDraft_all_valid_smoke_sid_UIN$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'
  IdRepository_CreateDraftVID_missing_vidtype:
      endPoint: /idrepository/v1/draft/vid
      description: Verify that the system rejects create draft VID when the API is called without the VID type field
      uniqueIdentifier: TC_IDRepo_CreateDraftVID_04
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftVID/createDraftVID
      outputTemplate: idRepository/error
      input: '{
      "vidType": "$REMOVE$",
      "UIN": "$ID:GetDraft_all_valid_smoke_sid_UIN$"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-001"
    }
  ]
}'
  IdRepository_CreateDraftVID_Invalid_UIN:
      endPoint: /idrepository/v1/draft/vid
      description: Verify that the system rejects create draft VID when the API is called with an invalid UIN
      uniqueIdentifier: TC_IDRepo_CreateDraftVID_05
      role: idrepo
      restMethod: post
      inputTemplate: idRepository/CreateDraftVID/createDraftVID
      outputTemplate: idRepository/error
      input: '{
      "vidType": "Perpetual",
      "UIN": "SNSHSH@U4U438"
      }'
      output: '{
   "errors": [
    {
      "errorCode": "IDR-IDC-002"
    }
  ]
}'