PublishDraft:
  IdRepository_PublishDraft_VID_all_valid_smoke:
      endPoint: /idrepository/v1/identity/draft/publish/{registrationId}
      description: Verify that the system successfully publishes a draft VID when the API is called with valid input details
      uniqueIdentifier: TC_IDRepo_PublishDraft_01
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/PublishDraft/publishDraftResult
      input: '{
      "registrationId":"$RID$"
      }'
      output: '{
      "status": "ACTIVATED"
}'
  IdRepository_RePublishDraft_VID_Invalid_Neg:
      endPoint: /idrepository/v1/identity/draft/publish/{registrationId}
      description: Verify that the system rejects republishing a draft VID when the API is called with invalid input details
      uniqueIdentifier: TC_IDRepo_PublishDraft_02
      role: idrepo
      restMethod: get
      inputTemplate: idRepository/PublishDraft/publishDraft
      outputTemplate: idRepository/error
      input: '{
      "registrationId":"$RID$"
      }'
      output: '{
  "errors": [
    {
      "errorCode": "IDR-IDC-007"
    }
  ]
}'