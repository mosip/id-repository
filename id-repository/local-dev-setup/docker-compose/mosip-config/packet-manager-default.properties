##------------------------------------------------------Redis cache properties----------------------------------------------------
## The following properties will be used only when the redis cache provider  jar is available in the loader path of packetmanager service.
redis.cache.hostname=172.31.4.76
redis.cache.port=6379
# Time to live for 2hrs
spring.cache.redis.time-to-live=7200000

# Enable detailed AWS SDK logging (includes S3 requests/responses)
# Core request logging (most useful for S3 debugging)
logging.level.com.amazonaws.metrics=DEBUG
logging.level.com.amazonaws.latency=DEBUG
logging.level.com.amazonaws.request=DEBUG          # Shows request params, endpoints, signing info, AWS request IDs

# Very detailed (includes full HTTP request/response bodies if using wire logger)
logging.level.com.amazonaws.request.wire=TRACE     # Full wire-level (headers + payload) – extremely verbose, use briefly

# General SDK activity (errors, warnings, client lifecycle)
logging.level.com.amazonaws=DEBUG

# Latency / performance metrics logging (only if SDK metrics enabled)
logging.level.com.amazonaws.latency=DEBUG          # Related to metrics, shows timing breakdowns

# MOSIP-specific wrappers (Khazana / object store)
logging.level.io.mosip.kernel.objectstore=DEBUG
logging.level.io.mosip.kernel.objectstore.aws=DEBUG   # If sub-logger exists
logging.level.io.mosip.commons.packet.impl=DEBUG      # Packet storage calls


# Default values audit manager thread pool
mosip.packet.manager.audit.core-pool-size=4
mosip.packet.manager.audit.max-pool-size=16
mosip.packet.manager.audit.queue-capacity=500
mosip.packet.manager.audit.thread-name-prefix=Audit-
mosip.packet.manager.audit.await-termination-seconds=30

com.amazonaws.sdk.enableDefaultMetrics=false