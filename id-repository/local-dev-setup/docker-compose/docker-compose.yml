  # Consolidated ID-Repository (identity + VID + credential). Build the jar first:
  #   cd ../../ && mvn -pl id-repository-service -am clean package -DskipTests -Dgpg.skip=true
  id-repository-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: id_repository_service
    ports:
      - "8090:8090"
    volumes:
      - ../../id-repository-service/target:/app/target:ro
    working_dir: /app
    environment:
      SPRING_CLOUD_CONFIG_LABEL: develop
      JAVA_OPTS: -Xms512m -Xmx1536m
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mock-service:
        condition: service_healthy
      websub-mock:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keymanager-service:
        condition: service_healthy
      keymanager-init:
        condition: service_completed_successfully
      keys-generator-expiry:
        condition: service_completed_successfully
      datashare-service:
        condition: service_healthy
      biosdk-service:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        set -e;
        JAR=$$(ls ./target/id-repository-service-*.jar 2>/dev/null | grep -vE 'sources|javadoc|tests' | head -n 1 || true);
        if [ -z "$$JAR" ]; then
          echo "ERROR: id-repository-service jar not found under id-repository-service/target.";
          echo "Build first: cd id-repository && mvn -pl id-repository-service -am package -DskipTests -Dgpg.skip=true";
          exit 1;
        fi;
        echo "Waiting for config-server...";
        for i in $$(seq 1 60); do
          if curl -sf "http://config-server:51000/config/id-repository/default" >/dev/null; then
            echo "config-server is ready";
            break;
          fi;
          if [ "$$i" -eq 60 ]; then
            echo "ERROR: config-server not reachable at http://config-server:51000/config";
            exit 1;
          fi;
          sleep 2;
        done;
        java $$JAVA_OPTS
        -Dfile.encoding=UTF-8
        --add-opens java.base/java.lang=ALL-UNNAMED
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens java.base/java.io=ALL-UNNAMED
        -Dspring.cloud.config.uri=http://config-server:51000/config
        -Dspring.config.import=configserver:http://config-server:51000/config
        -Dspring.cloud.config.label=$${SPRING_CLOUD_CONFIG_LABEL}
        -Dspring.cloud.config.name=application,id-repository,credential-service,credential-request
        -Dspring.application.name=id-repository
        -Dspring.profiles.active=default
        -Dspring.cloud.loadbalancer.enabled=false
        -Dserver.port=8090
        -Dmosip.idrepo.identity.db.url=jdbc:postgresql://database:5432/mosip_idrepo
        -Dmosip.idrepo.identity.db.username=idrepouser
        -Dmosip.idrepo.identity.db.password=mosip123
        -Dmosip.idrepo.vid.db.url=jdbc:postgresql://database:5432/mosip_idmap
        -Dmosip.idrepo.vid.db.username=idmapuser
        -Dmosip.idrepo.vid.db.password=mosip123
        -Dmosip.credential.service.jdbc.url=jdbc:postgresql://database:5432/mosip_credential
        -Dmosip.credential.service.jdbc.user=credentialuser
