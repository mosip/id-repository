spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:https://dev1.mosip.net/config}
spring.cloud.config.label=${SPRING_CLOUD_CONFIG_LABEL:1.1.2}
spring.cloud.config.name=application,id-repository
spring.application.name=id-repository
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.main.web-application-type=none

# Chunked JDBC batch size for 1M+ salt keys (memory-safe)
mosip.kernel.salt-generator.chunk-size=500

health.config.enabled=false

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health
