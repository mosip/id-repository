# Spring Boot logging (logback-spring.xml); avoids plain logback.xml from MOSIP dependency jars
logging.config=classpath:logback-spring.xml
# Console (readable) + rolling JSON file under logging.file.path (see logback-spring.xml)
logging.file.path=logs

# Local default until config server provides it (HttpModeScanConfiguration component scan)
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter

# Boot 4: config import must use spring.cloud.config.uri (JVM -D / relaxed env binding)
spring.cloud.bootstrap.enabled=false
spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:http://localhost:51000/config}
spring.config.import=optional:configserver:${spring.cloud.config.uri}

spring.cloud.config.label=${SPRING_CLOUD_CONFIG_LABEL:1.1.2}
spring.cloud.config.name=application,id-repository,credential-service,credential-request
spring.application.name=id-repository
# Active profile from deployment env (K8s: active_profile_env). Unset = default (config server default files).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh,restart,prometheus

# ID-Repository service on a single port, root servlet (path prefixes applied per controller group)
server.port=8090
server.servlet.path=/
spring.mvc.servlet.path=/

# Boot 4: PathPattern is default; overrides config-server ANT_PATH_MATCHER from application-default.
spring.mvc.pathmatch.matching-strategy=PATH_PATTERN_PARSER

# kernel-auth: profile "local" + offline token validate throws OFFLINE_AUTH_DEPRECATED on every API call.
# Use online IAM userinfo introspection (requires reachable auth.server.admin.issuer.* from config server).
auth.server.admin.offline.comp.token.validate=false

# kernel-auth plainWebClient / RestTemplate: config-server IAM URLs are external hostnames, not K8s service IDs.
# Exclude ALL load-balancer auto-configs — excluding only LoadBalancerAutoConfiguration leaves
# BlockingLoadBalancerClientAutoConfiguration active, which then fails looking for ReactiveLoadBalancer$Factory.
spring.cloud.loadbalancer.enabled=false
spring.autoconfigure.exclude=\
org.springframework.cloud.loadbalancer.config.LoadBalancerAutoConfiguration,\
org.springframework.cloud.loadbalancer.config.BlockingLoadBalancerClientAutoConfiguration,\
org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration,\
org.springframework.cloud.loadbalancer.config.LoadBalancerStatsAutoConfiguration,\
org.springframework.cloud.loadbalancer.security.OAuth2LoadBalancerClientAutoConfiguration

# Self-token (outbound audit, PMS, cryptomanager): from config server — mosip.iam.adapter.clientid.id-repository,
# mosip.iam.adapter.clientsecret.id-repository, mosip.iam.adapter.appid.id-repository (see id-repository-default.properties).
# mosip.kernel.auth.appids.realm.map must include the appId key (e.g. idrepo -> mosip).
# auth.server.admin.issuer.uri / auth.server.admin.issuer.internal.uri must be reachable from your laptop.
# Local laptop: if curl to iam.dev2 works but self-token returns 500, internal URI may differ — clear it:
# -Dauth.server.admin.issuer.internal.uri=  (uses issuer.uri, same as curl)
# Optional local JVM override: -Dmosip.iam.adapter.clientsecret=... via MOSIP_IAM_ADAPTER_CLIENTSECRET in run-id-repository-local.bat

# Local runs: application-default sets mosip.pms.partnermanager.url=api.dev2 (public). For laptop access use
# run-id-repository-local.bat which overrides mosip.pms.partnermanager.url and mosip.kernel.auditmanager.url
# to MOSIP_IDREPO_BIOSDK_URL (default api-internal.dev2.mosip.net). URL paths resolve from config server:
# PARTNER_POLICY=.../partners/{partnerId}/credentialtype/{credentialType}/policies
# PARTNER_EXTRACTION_POLICY=.../partners/{partnerId}/bioextractors/{policyId}  (id-repository-default.properties)
#
# BioSDK: BioAPIFactory @PostConstruct calls Client_V_1_0.init → POST {biosdk.url}/init.
# Config often uses http://${mosip.api.internal.host}/biosdk-service; if that host is unset you get
# UnknownHostException: mosip.api.internal.host. run-id-repository-local.bat sets:
#   -Dmosip.api.internal.host=... -Dmosip.biosdk.default.service.url=.../biosdk-service
# IDE / plain mvn spring-boot:run must pass the same -D flags (system props beat config server).
#
# Object store: local MinIO via port-forward — mc alias "local" → http://localhost:9000, bucket idrepo, user admin.
# run-id-repository-local.bat JVM overrides match that (not dev2-idrepo / not minioadmin).

# Fail fast on bean collisions during consolidation
spring.main.allow-bean-definition-overriding=false

# Boot 4 defaults to Jackson 3; MOSIP code autowires com.fasterxml.jackson.databind.ObjectMapper
spring.http.converters.preferred-json-mapper=jackson2

# WebClient default buffer is 256 KiB; keymanager decrypt of biometrics can exceed 2 MiB
spring.codec.max-in-memory-size=20MB
mosip.idrepo.rest.client.max-in-memory-size=20971520

# Three separate databases (from config server or local overrides):
# mosip.idrepo.identity.db.url=jdbc:postgresql://<host>:5432/mosip_idrepo
# mosip.idrepo.vid.db.url=jdbc:postgresql://<host>:5432/mosip_idmap
# mosip.credential.service.jdbc.url=jdbc:postgresql://<host>:5432/mosip_credential

# Partner / PMS / WebSub response caches (Caffeine expire-after-write)
mosip.idrepo.partner.cache.ttl.minutes=5
# Internal DB salt and identity-attribute caches
mosip.idrepo.internal.cache.ttl.minutes=30

# Synchronous credential pipeline — no background batch/status jobs.
# Partner OLV cache eviction remains on a fixed delay (see mosip.idrepo.cache.update.interval).

# Audit + WebSub publish: async (default) to keep identity/credential APIs off the HTTP critical path.
# Set either to false for synchronous behaviour (e.g. local debugging / strict ordering).
# mosip.idrepo.audit.async-enabled=true          # audit-manager REST on withSecurityContext executor
# mosip.idrepo.websub.publish.async-enabled=true # CREDENTIAL_ISSUED / IDENTITY_* publish on webSubHelperExecutor
mosip.idrepo.audit.async-enabled=true
mosip.idrepo.websub.publish.async-enabled=true

# Internal pipeline: domain modules call each other via SDK adapters (no self-HTTP).
# External REST URLs (/identity, /vid, /credentialrequest, /credentialservice) remain for Reg Processor and partners.

# --- Local laptop: Datashare ---
# Config server sets mosip.data.share.internal.domain.name=datashare.datashare (K8s-only).
# run-id-repository-local.bat overrides to -Dmosip.data.share.internal.domain.name=<api-internal>
# and -Dmosip.data.share.protocol=https. DataShareUtil also remaps cluster hosts via mosip.api.internal.host.

# HikariCP — per-pod connection budgets (see IdRepoHikariDataSourceFactory)
# Local/JMeter: keep headroom; identity TX must not hold connections during sync credentials
# (see PendingCredentialSync). Defaults were 12/6/10 — too small when afterCommit held conns ~20s.
mosip.idrepo.identity.pool.max=32
mosip.idrepo.identity.pool.min=4
mosip.idrepo.identity.pool.timeout-ms=30000
mosip.idrepo.vid.pool.max=10
mosip.idrepo.vid.pool.min=2
mosip.idrepo.vid.pool.timeout-ms=30000
mosip.idrepo.credential.pool.max=16
mosip.idrepo.credential.pool.min=2
mosip.idrepo.credential.pool.timeout-ms=30000
mosip.idrepo.datasource.pool.idle-timeout-ms=600000
mosip.idrepo.datasource.pool.max-lifetime-ms=1800000

# Release EntityManager at request end without holding DB connections across remote I/O
spring.jpa.open-in-view=false

health.config.enabled=false

# Credential DB (PU3) — CredentialEntity
javax.persistence.jdbc.url=${mosip.credential.service.jdbc.url}
javax.persistence.jdbc.user=${mosip.credential.service.jdbc.user}
javax.persistence.jdbc.password=${mosip.credential.service.jdbc.password}
javax.persistence.jdbc.driver=${mosip.credential.service.jdbc.driver}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OpenAPI — per-service Swagger UI (see IdRepoOpenApiConfig)
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.remove-broken-reference-definitions=false
server.forward-headers-strategy=framework

mosipbox.public.url=http://localhost:8090
