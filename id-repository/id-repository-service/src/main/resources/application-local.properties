# Local workstation profile (spring.profiles.active=local).
# Use for host Maven/IDE testing against local-dev-setup/docker-compose.
# Do NOT edit an external mosip-config checkout for laptop runs — put overrides here.
# See id-repository/local-dev-setup/LOCAL-DEV-SETUP.md
#
# Override config-server location if needed:
#   SPRING_CLOUD_CONFIG_URI / SPRING_CLOUD_CONFIG_LABEL
# Host port is 51001 (compose maps 51001→51000). Inside Docker network use config-server:51000.

spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:http://localhost:51001/config}
spring.cloud.config.label=${SPRING_CLOUD_CONFIG_LABEL:develop}
# Load id-repository-default.properties from config-server (profile "local" alone is empty there).
spring.profiles.active=default,local

# Config-server "local" profile historically enables offline token validate, which throws
# OFFLINE_AUTH_DEPRECATED. Keep online IAM introspection for local API calls.
auth.server.admin.offline.comp.token.validate=false
spring.cloud.loadbalancer.enabled=false
mosip.auth.filter_disable=true

# Match id-repository-default.properties (needed if config-server is skipped/unreachable)
mosip.idrepo.crypto.refId.uin=uin
mosip.idrepo.crypto.refId.uin-data=identity_data
mosip.idrepo.crypto.refId.demo-doc-data=demographic_data
mosip.idrepo.crypto.refId.bio-doc-data=biometric_data

# WebSub secret (normally injected as env override in cluster)
idrepo.websub.vid.credential.update.secret=local-websub-secret
mosip.idrepo.websub.vid-credential-update.secret=${idrepo.websub.vid.credential.update.secret}

# --- Hosts / remotes (published compose ports) ---
mosip.api.internal.host=localhost
mosip.api.public.host=localhost
mosip.api.internal.url=http://localhost:8090
mosip.api.public.url=http://localhost:8090
mosip.kernel.keymanager.url=http://localhost:8088
mosip.kernel.authmanager.url=http://localhost:8082
mosip.kernel.auditmanager.url=http://localhost:8082
mosip.kernel.masterdata.url=http://localhost:8082
mosip.pms.partnermanager.url=http://localhost:8082
mosip.pms.policymanager.url=http://localhost:8082
mosip.datashare.url=http://localhost:8097
mosip.idrepo.biosdk.url=http://localhost:8083
mosip.mock.biosdk.url=http://localhost:8083
mosip.biosdk.default.service.url=http://localhost:8083
keycloak.internal.url=http://localhost:8082
keycloak.external.url=http://localhost:8082

# Encrypt / decrypt
mosip.idrepo.encryptor.rest.uri=${mosip.kernel.keymanager.url}/v1/keymanager/encrypt
mosip.idrepo.decryptor.rest.uri=${mosip.kernel.keymanager.url}/v1/keymanager/decrypt
KEYMANAGER_JWTSIGN=${mosip.kernel.keymanager.url}/v1/keymanager/jwtSign
KEYMANAGER_ENCRYPT_PIN=${mosip.kernel.keymanager.url}/v1/keymanager/encryptWithPin
KEYMANAGER_ENCRYPT_ZK=${mosip.kernel.keymanager.url}/v1/keymanager/zkEncrypt
KEYMANAGER_VERCRED_SIGN=${mosip.kernel.keymanager.url}/v1/keymanager/jwsSign

# Datashare (absolute URL keeps port 8097)
mosip.data.share.protocol=http
mosip.data.share.internal.domain.name=localhost
CREATEDATASHARE=http://localhost:8097/v1/datashare/create

