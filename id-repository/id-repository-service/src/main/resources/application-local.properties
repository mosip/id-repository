# Local workstation profile (activate with JVM: default,local).
# Use for host Maven/IDE testing against local-dev-setup/deps.
# Do NOT edit an external mosip-config checkout for laptop runs — put overrides here.
# See id-repository/local-dev-setup/LOCAL-DEV-SETUP.md
#
# Override config-server location if needed:
#   SPRING_CLOUD_CONFIG_URI / SPRING_CLOUD_CONFIG_LABEL
# Host port is 51100 (compose maps 51100→51000). Inside Docker network use config-server:51000.

spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:http://localhost:51100/config}
spring.cloud.config.label=${SPRING_CLOUD_CONFIG_LABEL:develop}
# Do not set the active profiles in this file — Spring Boot forbids that in a
# profile-specific resource. Host runners pass default,local on the JVM so
# config-server still loads id-repository-default.properties.

# Config-server "default" uses Docker DNS (mock-service, minio, …). Let this file win.
spring.cloud.config.override-none=true
spring.cloud.config.allow-override=true

# Offline JWT checks (v1.3.1): expiry, issuer host, RS256+JWKS, audience/azp.
# Keep JVM profiles default,local — profile "local" alone throws OFFLINE_AUTH_DEPRECATED.
auth.server.admin.offline.comp.token.validate=true
spring.cloud.loadbalancer.enabled=false
# AuthFilter on so SecurityContext has a UserDetails principal (cr_by / getUser()).
mosip.auth.filter_disable=false
# Self-token is required for identity → /draft/vid (publish draft). Local JWTs include claim clientId.
mosip.iam.adapter.self-token-renewal-enable=true

# Match id-repository-default.properties (needed if config-server is skipped/unreachable)
mosip.idrepo.crypto.refId.uin=uin
mosip.idrepo.crypto.refId.uin-data=identity_data
mosip.idrepo.crypto.refId.demo-doc-data=demographic_data
mosip.idrepo.crypto.refId.bio-doc-data=biometric_data

# WebSub secret (normally injected as env override in cluster)
idrepo.websub.vid.credential.update.secret=local-websub-secret
mosip.idrepo.websub.vid-credential-update.secret=${idrepo.websub.vid.credential.update.secret}

