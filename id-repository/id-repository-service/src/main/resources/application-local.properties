mosip.idrepo.db.vid.db-name=mosip_idmap
mosip.idrepo.db.vid.username=idmapuser
mosip.idrepo.db.vid.password=mosip123
mosip.idrepo.identity.db.url=jdbc:postgresql://localhost:5455/mosip_idrepo
mosip.idrepo.identity.db.username=idrepouser
mosip.idrepo.identity.db.password=mosip123
