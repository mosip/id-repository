mosip.idrepo.objectstore.bucket-name=idrepo

# Partner / PMS policy — local classpath JSON (from GET /v1/policymanager/policies dump)
# WireMock also serves the same list at http://localhost:8082/v1/policymanager/policies
mosip.idrepo.policy.local-source=true
mosip.idrepo.policy.local-index=classpath:pms_policy/partner-credential-policy-index.json
mosip.idrepo.policy.local-all=classpath:pms_policy/pms-all-policy.json
