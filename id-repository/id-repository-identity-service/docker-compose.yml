services:

  minio:
    image: minio/minio:latest
    container_name: mosip-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:14
    container_name: mosip-postgres
    restart: always
    environment:
      POSTGRES_DB: mosip_idrepo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE: local
        COMMIT_HASH: local
        COMMIT_ID: local
        BUILD_TIME: local
    container_name: mosip-idrepo
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - ./src/main/resources/identity-mapping.json:/home/mosip/identity-mapping.json
      - ./src/main/resources/application-local.properties:/home/mosip/application-local.properties
    environment:
      active_profile_env: "local"
      spring_config_label_env: "master"
      spring_config_url_env: "http://localhost:9999"
      is_glowroot_env: "off"
      kernel_ref_idobjectvalidator_url: ""
      iam_adapter_url_env: "https://repo1.maven.org/maven2/io/mosip/kernel/kernel-auth-adapter/1.3.0/kernel-auth-adapter-1.3.0.jar"
    command:
      - bash
      - -c
      - |
        echo 'Creating stub config files' &&
        mkdir -p /tmp/mosip-config &&
        echo '{"response":{"attributeUpdateCountLimit":{"IDSchemaVersion":99,"UIN":99,"fullName":99,"dateOfBirth":99,"age":99,"gender":99,"addressLine1":99,"addressLine2":99,"addressLine3":99,"region":99,"province":99,"city":99,"zone":99,"postalCode":99,"residenceStatus":99,"referenceIdentityNumber":99,"parentOrGuardianName":99,"parentOrGuardianRID":99,"parentOrGuardianUIN":99,"parentOrGuardianBiometrics":99,"individualBiometrics":99,"phone":99,"email":99},"identityUpdateTrackerPolicies":[],"identityUpdateCountPolicies":[],"policies":[]},"attributeUpdateCountLimit":{"IDSchemaVersion":99,"UIN":99,"fullName":99,"dateOfBirth":99,"age":99,"gender":99,"addressLine1":99,"addressLine2":99,"addressLine3":99,"region":99,"province":99,"city":99,"zone":99,"postalCode":99,"residenceStatus":99,"referenceIdentityNumber":99,"parentOrGuardianName":99,"parentOrGuardianRID":99,"parentOrGuardianUIN":99,"parentOrGuardianBiometrics":99,"individualBiometrics":99,"phone":99,"email":99},"identityUpdateTrackerPolicies":[],"identityUpdateCountPolicies":[],"policies":[],"updateCountPolicies":[]}' > /tmp/mosip-config/identity-update-count-policy.json &&
        sed 's/^{/{"attributeUpdateCountLimit":{"IDSchemaVersion":99,"UIN":99,"fullName":99,"dateOfBirth":99,"age":99,"gender":99,"addressLine1":99,"addressLine2":99,"addressLine3":99,"region":99,"province":99,"city":99,"zone":99,"postalCode":99,"residenceStatus":99,"referenceIdentityNumber":99,"parentOrGuardianName":99,"parentOrGuardianRID":99,"parentOrGuardianUIN":99,"parentOrGuardianBiometrics":99,"individualBiometrics":99,"phone":99,"email":99},/' /home/mosip/identity-mapping.json > /tmp/mosip-config/identity-mapping.json &&
        echo 'Downloading auth adapter' &&
        mkdir -p /home/mosip/additional_jars &&
        wget "$${iam_adapter_url_env}" -O /home/mosip/additional_jars/kernel-auth-adapter.jar &&
        echo 'Downloaded auth adapter' &&
        java -XX:-UseG1GC -XX:+ExplicitGCInvokesConcurrent -XX:-UseParallelGC -XX:+UseZGC -XX:+ZGenerational -XX:-UseShenandoahGC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:+UseCompressedOops -Dfile.encoding=UTF-8 -Dloader.path=/home/mosip/additional_jars/ -Dspring.profiles.active=local -Dspring.cloud.config.enabled=false -Dspring.cloud.config.import-check.enabled=false -Dmosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter -Ddb.dbuser.password=postgres -Dmosip.idrepo.db.url=postgres -Dmosip.idrepo.db.port=5432 "-Dmosip.idrepo.db.identity.db-name=mosip_idrepo" -Dmosip.idrepo.db.identity.username=postgres -Dmosip.idrepo.db.identity.password=postgres "-Dmosip.idrepo.identity.db.url=jdbc:postgresql://postgres:5432/mosip_idrepo" -Dmosip.idrepo.identity.db.username=postgres -Dmosip.idrepo.identity.db.password=postgres "-Dspring.datasource.url=jdbc:postgresql://postgres:5432/mosip_idrepo" -Dspring.datasource.username=postgres -Dspring.datasource.password=postgres -Dspring.jpa.hibernate.ddl-auto=update -Dspring.jpa.properties.hibernate.default_schema=idrepo -Dmosip.auth.filter_disable=true -Dmosip.iam.adapter.self-token-renewal-enable=false -Dsubscription-delay-secs=999999999 -Dresubscription-delay-secs=999999999 -Dmosip.idrepo.credential-status-update-job.fixed-delay-in-ms=999999999 -Dmosip.idrepo.identity.uin-status.registered=ACTIVATED -Dmosip.idrepo.identity.uin-status.deactivated=DEACTIVATED "-Dmosip.idrepo.identity.uin-status=ACTIVATED,BLOCKED,DEACTIVATED" -Dmanagement.health.redis.enabled=false -Dspring.flyway.enabled=false -Dspring.liquibase.enabled=false -Dmosip.idrepo.identity.max-request-time-deviation-seconds=99999 -Dmosip.idrepo.crypto.refId.uin=uin -Dmosip.idrepo.crypto.refId.uin-data=identity_data -Dmosip.idrepo.crypto.refId.demo-doc-data=demographic_data -Dmosip.idrepo.crypto.refId.bio-doc-data=biometric_data -Dmosip.idrepo.application.name=ID-Repository "-Dmosip.idrepo.application.version.pattern=^v\\d+(\\.\\d+)?$" -Dmosip.idrepo.datetime.future-time-adjustment=99999 -Dmosip.idrepo.identity.id.create=mosip.id.create -Dmosip.idrepo.identity.id.read=mosip.id.read -Dmosip.idrepo.identity.id.update=mosip.id.update -Dmosip.idrepo.identity.application.version=v1 -Dmosip.idrepo.identity.json.path=identity.UIN -Dmosip.idrepo.identity.allowedBioAttributes=individualBiometrics -Dmosip.idrepo.identity.bioAttributes=individualBiometrics,parentOrGuardianBiometrics -Dmosip.idrepo.active-async-thread-count=10 -Dmosip.idrepo.objectstore.account-name=local -Dmosip.idrepo.objectstore.bucket-name=local -Dmosip.idrepo.objectstore.adapter-name=s3Adapter -Dobjectstore.adapter.name=S3Adapter -Dobject.store.s3.url=http://minio:9000 -Dobject.store.s3.accesskey=admin -Dobject.store.s3.secretkey=adminpassword -Dmosip.kernel.uin.salt=9cl3KUcCASLyUYLD -Dmosip.kernel.partnercode.salt=4exm0iwskVVkV4vg -Dmosip.kernel.tokenid.uin.salt=9cl3KUcCASLyUYLD -Dmosip.kernel.tokenid.partnercode.salt=4exm0iwskVVkV4vg -Dmosip.idrepo.vid.active-status=ACTIVE -Dmosip.idrepo.vid.allowedstatus=ACTIVE,REVOKED,EXPIRED,USED,INVALIDATED,DEACTIVATED -Dmosip.idrepo.vid.deactive-status=DEACTIVATED -Dmosip.idrepo.vid.reactive-status=ACTIVE -Dmosip.idrepo.vid.unlimited-txn-status=USED -Dmosip.country.code=MOR -Dmosip.idrepo.credential.request.enable-convention-based-id=false -Didrepo-dummy-online-verification-partner-id=MOVP -Dmosip.kernel.data-key-splitter=#KEY_SPLITTER# -Dmosip.sign.applicationid=KERNEL -Dmosip.sign.refid=SIGN -Dmosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING -Dmosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/PKCS5Padding -Dmosip.kernel.keygenerator.asymmetric-algorithm-name=RSA -Dmosip.kernel.keygenerator.symmetric-algorithm-name=AES -Dmosip.kernel.keygenerator.asymmetric-key-length=2048 -Dmosip.kernel.crypto.gcm-tag-length=128 -Dmosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512 -Dmosip.kernel.crypto.hash-symmetric-key-length=256 -Dmosip.kernel.crypto.hash-iteration=100000 -Dmosip.kernel.crypto.sign-algorithm-name=RS256 -Dmosip.idrepo.update-identity.trim-whitespaces=true "-Dmosip.idrepo.update-identity.fields-to-replace=''" -Dwebsub.publish.url=http://localhost:9999/hub/ -Dwebsub.hub.url=http://localhost:9999/hub/ -Dmosip.idrepo.mosip-config-url=file:///tmp/mosip-config/ -Dmosip.identity.mapping-file=file:///tmp/mosip-config/identity-mapping.json -Dserver.servlet.path=/idrepository/v1/identity -Dmosip.security.ignore-paths=idrepository,identity,unsubscribe,idvid -Dmosip.security.ignore_paths=idrepository,identity,unsubscribe,idvid --add-opens java.base/sun.reflect.annotation=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-modules=ALL-SYSTEM --add-opens java.xml/jdk.xml.internal=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.time=ALL-UNNAMED --add-opens java.base/jdk.internal.reflect.DirectMethodHandleAccessor=ALL-UNNAMED -jar id-repository-identity-service.jar