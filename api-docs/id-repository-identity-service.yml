openapi: 3.0.1
info:
  title: Id Repository Identity Service
  description: |
    This API specification defines the endpoints for the Identity Repository (IdRepo) Service.

    It allows clients to:
    - Add or update identity data
    - Retrieve identity details
    - Manage draft records
    - Handle event callbacks for credential status updates
    - Perform authentication type status operations

  license:
    name: Mosip
    url: https://docs.mosip.io/platform/license
  version: '1.0'
servers:
  - url: https://api-internal.{env}.mosip.net/idrepository/v1/identity
    description: Id Repository Identity Service
tags:
  - name: id-repo-controller
    description: Id Repo Controller
  - name: id-repo-draft-controller
    description: Id Repo Draft Controller
  - name: websub-event-callback-controller
    description: Websub Event Callback Controller
paths:
  /:
    post:
      summary: Add a new identity to the Id Repository
      description: >
        Accepts identity creation requests with unique identifiers, demographic attributes, and optional documents.
        This endpoint validates the UIN, applies policy checks, and saves a new identity into the repository.
      operationId: addIdentity
      tags:
        - id-repo-controller
      requestBody:
        description: Add identity request payload
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Identity creation request
              required:
                - id
                - version
                - requesttime
                - request
              properties:
                id:
                  type: string
                  description: Unique request ID
                  example: mosip.id.create
                version:
                  type: string
                  description: API version
                  example: "v1"
                requesttime:
                  type: string
                  format: date-time
                  description: Current date and time when the request is sent
                  example: "2025-07-02T07:05:23.108Z"
                metadata:
                  type: object
                  description: Optional metadata
                  example: {}
                request:
                  type: object
                  description: Request body containing identity details
                  required:
                    - status
                    - identity
                  properties:
                    status:
                      type: string
                      description: Status of the identity
                      example: ACTIVE
                    identity:
                      type: object
                      description: Complete identity structure
                      properties:
                        gender:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "MLE"
                        city:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_CITYeng"
                        postalCode:
                          type: string
                          example: "14022"
                        dateOfBirth:
                          type: string
                          example: "1992/04/15"
                        fullName:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_FIRSTNAMEeng"
                        proofOfIdentity:
                          type: object
                          properties:
                            format:
                              type: string
                              example: "txt"
                            type:
                              type: string
                              example: "DOC001"
                            value:
                              type: string
                              example: "fileReferenceID"
                        individualBiometrics:
                          type: object
                          properties:
                            format:
                              type: string
                              example: "cbeff"
                            version:
                              type: number
                              example: 1
                            value:
                              type: string
                              example: "fileReferenceID"
                        IDSchemaVersion:
                          type: number
                          example: 0.1
                        province:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_PROVINCEeng"
                        zone:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_ZONEeng"
                        phone:
                          type: string
                          example: "7936066950"
                        addressLine1:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_ADDRESSLINE1eng"
                        UIN:
                          type: string
                          example: "9136803549"
                        region:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "TEST_REGIONeng"
                        email:
                          type: string
                          format: email
                          example: "Resident_AddIdentity_Positive_PDEA_smoke@mosip.net"
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            example: "PHOTO"
                          value:
                            type: string
                            example: "base64EncodedString"
                    registrationId:
                      type: string
                      example: "333123456789"
                    uin:
                      type: string
                      example: "3333987654321"
                    verifiedAttributes:
                      type: array
                      items:
                        type: string
                      example:
                        - "fullName"
                        - "gender"
                        - "dob"
            examples:
              example-1:
                value:
                  id: mosip.id.create
                  version: "v1"
                  requesttime: "2025-07-02T07:05:23.108Z"
                  metadata: {}
                  request:
                    status: ACTIVE
                    identity:
                      gender:
                        - language: eng
                          value: MLE
                      city:
                        - language: eng
                          value: TEST_CITYeng
                      postalCode: "14022"
                      dateOfBirth: "1992/04/15"
                      fullName:
                        - language: eng
                          value: TEST_FIRSTNAMEeng
                      proofOfIdentity:
                        format: txt
                        type: DOC001
                        value: fileReferenceID
                      individualBiometrics:
                        format: cbeff
                        version: 1
                        value: fileReferenceID
                      IDSchemaVersion: 0.1
                      province:
                        - language: eng
                          value: TEST_PROVINCEeng
                      zone:
                        - language: eng
                          value: TEST_ZONEeng
                      phone: "7936066950"
                      addressLine1:
                        - language: eng
                          value: TEST_ADDRESSLINE1eng
                      UIN: "9136803549"
                      region:
                        - language: eng
                          value: TEST_REGIONeng
                      email: "Resident_AddIdentity_Positive_PDEA_smoke@mosip.net"
                    documents:
                      - category: individualBiometrics
                        value: base64EncodedString
                    registrationId: "666666123456789"
                    uin: "9876543211"
                    verifiedAttributes:
                      - fullName
                      - gender
                      - dob
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique response ID
                  version:
                    type: string
                    description: API version
                  responsetime:
                    type: string
                    format: date-time
                    description: Time at which response was generated
                  metadata:
                    type: object
                    description: Optional metadata
                  response:
                    type: object
                    description: Response object containing identity details
                    properties:
                      status:
                        type: string
                        description: Status of the add identity operation
                      identity:
                        type: object
                        description: Echoed back identity object
                      documents:
                        type: array
                        description: List of documents linked with identity
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              description: Type/category of the document
                            value:
                              type: string
                              description: Base64-encoded document or reference
                      registrationId:
                        type: string
                        description: Registration ID linked to identity
                      uin:
                        type: string
                        description: Unique Identity Number
                      verifiedAttributes:
                        type: array
                        description: List of verified attributes
                        items:
                          type: string
                  errors:
                    type: array
                    description: Any errors encountered
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                          description: Code representing the type of error
                        message:
                          type: string
                          description: Human-readable error message
              examples:
                example-1:
                  value:
                    id: mosip.id.create
                    version: "v1"
                    responsetime: "2025-07-02T07:05:23.108Z"
                    metadata: {}
                    response:
                      status: ACTIVATED
                      identity: {}
                      documents:
                        - category: individualBiometrics
                          value: base64EncodedString
                      registrationId: "888123456789"
                      uin: "8765432155"
                      verifiedAttributes:
                        - fullName
                        - dob
                    errors: []
        '204':
          description: No Content

        '401':
          description: Unauthorized

        '403':
          description: Forbidden
    patch:
      tags:
        - id-repo-controller
      summary: Update an existing identity
      description: |
        Updates an existing identity record in the Id Repository based on the provided UIN and registration ID.
        This operation allows modifications to demographic attributes, linked documents, and status fields.
      operationId: updateIdentity
      requestBody:
        required: true
        description: Update Identity request payload
        content:
          application/json:
            schema:
              type: object
              description: Update Identity request
              required:
                - id
                - version
                - requesttime
                - request
              properties:
                id:
                  type: string
                  description: Unique request identifier
                  example: mosip.id.update
                version:
                  type: string
                  description: API version
                  example: "v1"
                requesttime:
                  type: string
                  format: date-time
                  description: Time of the request
                  example: "2025-07-02T09:30:00.000Z"
                metadata:
                  type: object
                  description: Optional metadata
                  example: {}
                request:
                  type: object
                  description: Contains identity updates
                  required:
                    - status
                    - identity
                    - registrationId
                    - uin
                  properties:
                    status:
                      type: string
                      description: New status for the identity
                      example: ACTIVATED
                    registrationId:
                      type: string
                      description: Unique registration identifier
                      example: "666611223344"
                    uin:
                      type: string
                      description: Unique Identification Number
                      example: "5566778899"
                    verifiedAttributes:
                      type: array
                      description: List of attributes verified
                      items:
                        type: string
                      example: ["fullName", "gender"]
                    identity:
                      type: object
                      description: Identity data to be updated
                      properties:
                        fullName:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "Updated Firstname"
                        gender:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "MLE"
                        city:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "Updated City"
                        phone:
                          type: string
                          example: "9123456789"
                        email:
                          type: string
                          format: email
                          example: "updated.email@mosip.net"
                        addressLine1:
                          type: array
                          items:
                            type: object
                            properties:
                              language:
                                type: string
                                example: "eng"
                              value:
                                type: string
                                example: "Updated Address Line 1"
                        dateOfBirth:
                          type: string
                          example: "1990/01/01"
                        postalCode:
                          type: string
                          example: "500001"
                    documents:
                      type: array
                      description: Updated documents
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            example: "individualBiometrics"
                          value:
                            type: string
                            example: "newBase64EncodedPhotoData"
            examples:
              example-1:
                value:
                  id: mosip.id.update
                  version: "v1"
                  requesttime: "2025-07-02T09:30:00.000Z"
                  metadata: {}
                  request:
                    status: ACTIVATED
                    registrationId: "66611223344"
                    uin: "5566778899"
                    verifiedAttributes:
                      - fullName
                      - gender
                    identity:
                      fullName:
                        - language: eng
                          value: Updated Firstname
                      gender:
                        - language: eng
                          value: MLE
                      city:
                        - language: eng
                          value: Updated City
                      phone: "9123456789"
                      email: "updated.email@mosip.net"
                      addressLine1:
                        - language: eng
                          value: Updated Address Line 1
                      dateOfBirth: "1990/01/01"
                      postalCode: "500001"
                    documents:
                      - category: individualBiometrics
                        value: newBase64EncodedPhotoData

      responses:
        '200':
          description: Identity successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique response ID
                  version:
                    type: string
                    description: API version
                  responsetime:
                    type: string
                    format: date-time
                    description: Time at which response was generated
                  metadata:
                    type: object
                    description: Optional metadata
                  response:
                    type: object
                    description: Response payload for identity update
                    properties:
                      status:
                        type: string
                        description: Status of the identity after update
                      identity:
                        type: object
                        description: Echoed back identity
                      documents:
                        type: array
                        description: Updated documents
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              description: Document type
                            value:
                              type: string
                              description: Document reference or base64
                      registrationId:
                        type: string
                        description: Registration ID
                      uin:
                        type: string
                        description: Unique Identity Number
                      verifiedAttributes:
                        type: array
                        description: List of updated/verified attributes
                        items:
                          type: string
                        example:
                  errors:
                    type: array
                    description: Any errors encountered
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                          description: Error code
                          example: "string"
                        message:
                          type: string
                          description: Error message
                          example: "string"
              examples:
                example-1:
                  value:
                    id: mosip.id.update
                    version: "v1"
                    responsetime: "2025-07-02T07:05:23.108Z"
                    metadata: {}
                    response:
                      status: ACTIVATED
                      identity: {}
                      documents:
                        - category: individualBiometrics
                          value: base64EncodedString
                      registrationId: "777123456789"
                      uin: "9876543211"
                      verifiedAttributes:
                        - fullName
                        - dob
                    errors: []

        '204':
          description: No Content

        '401':
          description: Unauthorized

        '403':
          description: Forbidden

  /{individualId}/update-counts:
    get:
      tags:
        - id-repo-controller
      summary: Get Remaining Update Count by Individual ID
      description: >
        Retrieves how many times each identity attribute (e.g., name, gender, address) can still be updated
        for a given individual ID. This limit is based on policy constraints defined in the system.
      operationId: getRemainingUpdateCountByIndividualId
      parameters:
        - name: individualId
          in: path
          required: true
          description: Unique identifier for the individual (UIN, RID, or VID)
          schema:
            type: string
            example: "123456789012"
        - name: idType
          in: query
          required: false
          description: Type of individual ID (UIN, VID, or RID)
          schema:
            type: string
            example: "UIN"
        - name: attribute_list
          in: query
          required: false
          description: List of attributes to query update count for
          schema:
            type: array
            items:
              type: string
            example: ["fullName"]
      responses:
        '200':
          description: Remaining update counts successfully retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                    description: Unique response ID
                    example: mosip.id.update
                  version:
                    type: string
                    nullable: true
                    description: API version
                    example: "v1"
                  responsetime:
                    type: string
                    format: date-time
                    description: Time at which the response was generated
                    example: "2025-07-02T10:00:36.866Z"
                  metadata:
                    type: object
                    nullable: true
                    description: Optional metadata
                    example: null
                  response:
                    type: object
                    description: Response object containing remaining update counts
                    properties:
                      attributes:
                        type: array
                        description: List of attributes and how many updates are left
                        items:
                          type: object
                          properties:
                            attributeName:
                              type: string
                              example: "fullName"
                            noOfUpdatesLeft:
                              type: integer
                              example: 5
                  errors:
                    type: array
                    description: List of error details (if any)
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                          example: "string"
                        message:
                          type: string
                          example: "string"
              examples:
                example-1:
                  value:
                    id: mosip.id.update
                    version: "v1"
                    responsetime: "2025-07-02T10:00:36.866Z"
                    metadata: null
                    response:
                      attributes:
                        - attributeName: "fullName"
                          noOfUpdatesLeft: 5
                    errors: []
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found

  /authtypes/status:
    post:
      tags:
        - id-repo-controller
      summary: Update authentication type status for an individual
      description: >
        This endpoint is used by internal services to lock or unlock specific authentication types
        (such as biometrics or OTP) for a given individual ID (UIN, VID, or RID).

        It supports bulk status updates (lock/unlock) and defines a duration for unlock if needed.
      operationId: updateAuthtypeStatus
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Unique request identifier
                  example: "mosip.idrepo.authtype.status.update"
                version:
                  type: string
                  description: API version
                  example: "1.0"
                requestTime:
                  type: string
                  format: date-time
                  description: Time when the request was made
                  example: "2025-07-03T10:00:00Z"
                consentObtained:
                  type: boolean
                  description: Flag indicating if consent was obtained
                  example: true
                individualId:
                  type: string
                  description: Unique identifier for the individual (UIN, VID, or RID)
                  example: "4631203960"
                individualIdType:
                  type: string
                  description: Type of individual ID
                  example: "UIN"
                request:
                  type: array
                  description: List of authentication type status update requests
                  items:
                    type: object
                    properties:
                      authType:
                        type: string
                        description: Type of authentication (e.g., bio, otp)
                        example: "bio"
                      authSubType:
                        type: string
                        description: Subtype of authentication (e.g., FINGER, FACE)
                        example: "FACE"
                      locked:
                        type: boolean
                        description: Lock status (true for locked, false for unlocked)
                        example: true
                      unlockForSeconds:
                        type: number
                        description: Unlock duration in seconds; 0 for no temporary unlock
                        example: 3600
                      requestId:
                        type: string
                        description: Unique request ID for tracking
                        example: "req-123"
                      metadata:
                        type: object
                        description: Additional metadata for the request
                        additionalProperties: {}
                        example:
                          additionalProp1: {}
                          additionalProp2: {}
                          additionalProp3: {}
            examples:
              example-1:
                value:
                  id: "mosip.idrepo.authtype.status.update"
                  version: "1.0"
                  requestTime: "2025-07-03T10:00:00Z"
                  consentObtained: true
                  individualId: "4631203960"
                  individualIdType: "UIN"
                  request:
                    - authType: "bio"
                      authSubType: "FACE"
                      locked: true
                      unlockForSeconds: 3600
                      requestId: "req-123"
                      metadata:
                        additionalProp1: {}
                        additionalProp2: {}
                        additionalProp3: {}
      responses:
        '200':
          description: Request processed successfully
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                    example: "mosip.idrepo.authtype.status.update.response"
                  version:
                    type: string
                    nullable: true
                    example: "1.0"
                  responsetime:
                    type: string
                    format: date-time
                    example: "2025-07-03T05:25:20.142Z"
                  metadata:
                    type: object
                    nullable: true
                    example:
                      requestId: "abc-123"
                  response:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "Success"
                      identity:
                        type: object
                        nullable: true
                        example:
                          fullName:
                            - language: "eng"
                              value: "Madhu_eng"
                            - language: "fra"
                              value: "Madhu_fra"
                      documents:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            documentType:
                              type: string
                            documentId:
                              type: string
                        example:
                          - documentType: "Proof of Address"
                            documentId: "ADDR123456"
                      verifiedAttributes:
                        type: array
                        nullable: true
                        items:
                          type: string
                        example:
                          - "fullName"
                          - "dob"
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                        message:
                          type: string
                    example:
                      - errorCode: "ERR-001"
                        message: "Sample error message"
              examples:
                example-1:
                  value:
                    id: "mosip.idrepo.authtype.status.update.response"
                    version: "1.0"
                    responsetime: "2025-07-03T05:25:20.142Z"
                    metadata:
                      requestId: "abc-123"
                    response:
                      status: "Success"
                      identity:
                        fullName:
                          - language: "eng"
                            value: "Madhu_eng"
                          - language: "fra"
                            value: "Madhu_fra"
                      documents:
                        - documentType: "Proof of Address"
                          documentId: "ADDR123456"
                      verifiedAttributes:
                        - "fullName"
                        - "dob"
                    errors:
                      - errorCode: "ERR-001"
                        message: "Sample error message"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found

  /authtypes/status/{ID}:
    get:
      tags:
        - id-repo-controller
      summary: Get authentication type lock/unlock status
      description: >
        Retrieves the current authentication type status for the given individual ID (UIN, VID, or RID).
        The system identifies the ID type automatically based on its format and returns the status of 
        all configured authentication types (e.g., fingerprint, iris, face, OTP).
      operationId: getAuthTypeStatus
      parameters:
        - name: ID
          in: path
          required: true
          description: Unique identifier for the individual (UIN, VID, or RID)
          schema:
            type: string
            example: "4631203960"
      responses:
        '200':
          description: Request authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                    example: "mosip.idrepo.authtype.status.fetch.response"
                  version:
                    type: string
                    nullable: true
                    example: "1.0"
                  responsetime:
                    type: string
                    format: date-time
                    example: "2025-07-03T05:32:00.452Z"
                  metadata:
                    type: object
                    nullable: true
                    example:
                      requestId: "abc-456"
                  response:
                    type: object
                    properties:
                      authTypes:
                        type: array
                        description: List of authentication types and their lock/unlock status
                        items:
                          type: object
                          properties:
                            authType:
                              type: string
                              example: "otp"
                            authSubType:
                              type: string
                              example: "email"
                            locked:
                              type: boolean
                              example: false
                            unlockForSeconds:
                              type: number
                              nullable: true
                              example: 3600
                            requestId:
                              type: string
                              nullable: true
                              example: "req-789"
                            metadata:
                              type: object
                              nullable: true
                              example:
                                channel: "SMS"
                                remarks: "Temporary unlock granted"
                  errors:
                    type: array
                    description: List of error details (if any)
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                          example: "string"
                        message:
                          type: string
                          example: "string"
                    example: []
              examples:
                example-1:
                  summary: Example
                  value:
                    id: "mosip.idrepo.authtype.status.fetch.response"
                    version: "1.0"
                    responsetime: "2025-07-03T05:32:00.452Z"
