  /draft/extractbiometrics/{registrationId}:
    put:
      tags:
        - id-repo-draft-controller
      summary: Extract biometrics for a draft identity using specified formats
      description: >
        Extracts biometric data (finger, iris, face) from the draft identity for the given registration ID using the specified image formats.
      operationId: extractBiometrics
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Registration ID for which biometrics should be extracted
          schema:
            type: string
            example: "2784753091216526"
        - name: fingerExtractionFormat
          in: query
          required: false
          description: Desired image format for fingerprint extraction (e.g., mock-1.1, ISO)
          schema:
            type: string
            example: "mock-1.1"
        - name: irisExtractionFormat
          in: query
          required: false
          description: Desired image format for iris extraction
          schema:
            type: string
            example: "mock-1.1"
        - name: faceExtractionFormat
          in: query
          required: false
          description: Desired image format for face extraction
          schema:
            type: string
            example: "mock-1.1"
      responses:
        '200':
          description: Biometrics extracted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                    description: Unique response identifier; may be null if not set
                  version:
                    type: string
                    nullable: true
                    description: API version; may be null if not set
                  responsetime:
                    type: string
                    format: date-time
                    description: Time when the response was generated
                  metadata:
                    type: object
                    nullable: true
                    description: Optional metadata
                  response:
                    type: object
                    description: Response containing extracted biometric data
                    properties:
                      status:
                        type: string
                        description: Current status of the draft (e.g., DRAFTED)
                      identity:
                        type: object
                        description: Basic identity information
                        properties:
                          name:
                            type: string
                          dob:
                            type: string
                            format: date
                          gender:
                            type: string
                          phone:
                            type: string
                          email:
                            type: string
                      documents:
                        type: array
                        description: List of associated documents
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                            value:
                              type: string
                      registrationId:
                        type: string
                      uin:
                        type: string
                      biometricReferenceId:
                        type: string
                      verifiedAttributes:
                        type: array
                        items:
                          type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                          description: Error code
                        message:
                          type: string
                          description: Error message
              examples:
                example-1:
                  value:
                    id: "mosip.idrepo.draft.extract-biometrics"
                    version: "1.0"
                    responsetime: "2025-07-02T16:19:42.794Z"
                    metadata: {}
                    response:
                      status: "DRAFTED"
                      identity:
                        name: "Ravi Kumar"
                        dob: "1985-06-25"
                        gender: "M"
                        phone: "9876543210"
                        email: "ravi.kumar@example.com"
                      documents:
                        - category: "POI"
                          value: "Base64EncodedPOIImageString=="
                        - category: "POA"
                          value: "Base64EncodedPOAImageString=="
                      registrationId: "2784753602993732022091216526"
                      uin: "123456789012"
                      biometricReferenceId: "bio-ref-123456789012"
                      verifiedAttributes:
                        - "name"
                        - "dob"
                        - "gender"
                    errors: []
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found

  /draft/discard/{registrationId}:
    delete:
      tags:
        - id-repo-draft-controller
      summary: Discard draft identity for registration ID
      description: >
        Deletes the draft identity associated with the specified registration ID.
        This operation is used to abandon the registration flow and clean up unneeded drafts.
      operationId: discardDraft
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Registration ID of the draft to be discarded
          schema:
            type: string
            example: "27847531216526"
      responses:
        '200':
          description: Draft identity discarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                    description: Unique response identifier; may be null if not set
                  version:
                    type: string
                    nullable: true
                    description: API version; may be null if not set
                  responsetime:
                    type: string
                    format: date-time
                    description: Time when the response was generated
                  metadata:
                    type: object
                    nullable: true
                    description: Optional metadata
                  response:
                    type: object
                    description: Response containing the result of discard operation
                    properties:
                      status:
                        type: string
                        description: Current status of the draft (e.g., DISCARDED)
                      identity:
                        type: object
                        description: Identity data at the time of discard
                        properties:
                          name:
                            type: string
                          dob:
                            type: string
                            format: date
                          gender:
                            type: string
                          phone:
                            type: string
                          email:
                            type: string
                      documents:
                        type: array
                        description: Documents associated with the draft
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                            value:
                              type: string
                      registrationId:
                        type: string
                        description: Registration ID that was discarded
                      uin:
                        type: string
                        description: UIN linked with the draft (if any)
                      biometricReferenceId:
                        type: string
                        description: Biometric reference ID
                      verifiedAttributes:
                        type: array
                        items:
                          type: string
                        description: List of verified attributes
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorCode:
                          type: string
                        message:
                          type: string
              examples:
                example-1:
                  value:
                    id: "mosip.idrepo.draft.discard"
                    version: "1.0"
                    responsetime: "2025-07-02T16:26:38.104Z"
                    metadata: {}
                    response:
                      status: "DISCARDED"
                      identity:
                        name: "Rahul Verma"
                        dob: "1991-05-20"
                        gender: "M"
                        phone: "9876543210"
                        email: "rahul.verma@example.com"
                      documents:
                        - category: "POI"
                          value: "Base64EncodedPOIImageString=="
                        - category: "POA"
                          value: "Base64EncodedPOAImageString=="
                      registrationId: "2784753602993732022091216526"
                      uin: "123456789012"
                      biometricReferenceId: "bio-ref-123456789012"
                      verifiedAttributes:
                        - "name"
                        - "dob"
                        - "gender"
                    errors: []
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found

