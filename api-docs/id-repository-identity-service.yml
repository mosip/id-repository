          in: path
          required: true
          description: Unique registration ID associated with the draft record
          schema:
            type: string
            example: "278436029937326"
        - name: fingerExtractionFormat
          in: query
          required: false
          description: Desired format for fingerprint extraction
          schema:
            type: string
            example: mock-1.1
        - name: irisExtractionFormat
          in: query
          required: false
          description: Desired format for iris extraction
          schema:
            type: string
            example: mock-1.1
        - name: faceExtractionFormat
          in: query
          required: false
          description: Desired format for face extraction
          schema:
            type: string
            example: mock-1.1
      responses:
        '200':
          description: Draft identity successfully retrieved
