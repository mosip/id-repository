openapi: 3.0.1
info:
  title: MOSIP Credential Request Generator API
  description: >
    Credential request queue APIs exposed by the consolidated id-repository-service under
    `/v1/credentialrequest` (requestgenerator, status, cancel, retrigger, WebSub callback).
  version: '1.2.1'
  contact:
    name: MOSIP Development Team
    email: dev@mosip.io
    url: https://www.mosip.io
  license:
    name: MPL 2.0
    url: https://www.mozilla.org/en-US/MPL/2.0/

servers:
  - url: 'https://api-internal.{env}.mosip.net/v1/credentialrequest'
    description: Cluster (Service identity.idrepo)
    variables:
      env:
        default: collab
  - url: 'http://localhost:8090/v1/credentialrequest'
    description: Local consolidated id-repository-service

tags:
  - name: Credential Request Generator
    description: Queue and status APIs for credential issuance

paths:
  /requestgenerator:
    post:
      tags: [Credential Request Generator]
      summary: Create credential request (v1)
      operationId: createCredentialRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialIssueRequestWrapper'
      responses:
        '200':
          description: Request accepted
        '401':
          description: Unauthorized

  /v2/requestgenerator/{rid}:
    post:
      tags: [Credential Request Generator]
      summary: Create credential request (v2, with RID)
      operationId: createCredentialRequestV2
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialIssueRequestWrapper'
      responses:
        '200':
          description: Request accepted
        '401':
          description: Unauthorized

  /cancel/{requestId}:
    get:
      tags: [Credential Request Generator]
      summary: Cancel a credential request
      operationId: cancelCredentialRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
        '401':
          description: Unauthorized

  /get/{requestId}:
    get:
      tags: [Credential Request Generator]
      summary: Get credential request by id
      operationId: getCredentialRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request status
        '401':
          description: Unauthorized

  /callback/notifyStatus:
    post:
      tags: [Credential Request Generator]
      summary: WebSub credential status callback
      operationId: notifyCredentialStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Unauthorized

  /getRequestIds:
    get:
      tags: [Credential Request Generator]
      summary: List credential request ids
      operationId: getRequestIds
      parameters:
        - name: statusCode
          in: query
          required: false
          schema:
            type: string
        - name: effectivedtimes
          in: query
          required: false
          schema:
            type: string
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Page of request ids
        '401':
          description: Unauthorized

  /retrigger/{requestId}:
    put:
      tags: [Credential Request Generator]
      summary: Retrigger a credential request
      operationId: retriggerCredentialRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retriggered
        '401':
          description: Unauthorized

  /scheduleRetrySubscription:
    get:
      tags: [Credential Request Generator]
      summary: Schedule WebSub subscription retry
      operationId: scheduleRetrySubscription
      responses:
        '200':
          description: Scheduled

  /scheduleWebsubSubscription:
    get:
      tags: [Credential Request Generator]
      summary: Schedule WebSub subscription
      operationId: scheduleWebsubSubscription
      responses:
        '200':
          description: Scheduled

components:
  schemas:
    CredentialIssueRequestWrapper:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        requesttime:
          type: string
          format: date-time
        request:
          type: object
          additionalProperties: true
